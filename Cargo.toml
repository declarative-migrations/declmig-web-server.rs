    [package]
    name = "declmig-web-server"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "MASH web server for Declarative Migrations"
    repository = "https://github.com/declarative-migrations/declmig-web-server.rs"

    [features]
    default = ["tcp-transport", "nats-transport"]
    tcp-transport = []
    nats-transport = []

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    thiserror = "2"

[lints.rust]
unsafe_code = "forbid"


